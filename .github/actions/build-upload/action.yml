name: Build and upload an iOS app
description: Archive, sign, inspect, retain, upload, and verify one configured iOS app.

inputs:
  config_path:
    description: Repository-relative path to the non-sensitive iOS build configuration.
    required: true
  marketing_version:
    description: Three-component CFBundleShortVersionString.
    required: true
  build_number:
    description: Optional positive integer CFBundleVersion override.
    required: false
    default: ""
  upload_to_asc:
    description: Whether to upload the validated IPA to App Store Connect.
    required: false
    default: "false"
  submit_to_review:
    description: Whether to submit the prepared App Store version to App Review after processing.
    required: false
    default: "false"
  update_asc_text_metadata:
    description: Whether to patch only the App Store text metadata fields declared in the metadata manifest.
    required: false
    default: "false"
  replace_asc_media:
    description: Whether to replace only the screenshot and app preview collections declared in the metadata manifest.
    required: false
    default: "false"
  ios_distribution_p12_base64:
    description: Base64-encoded Apple Distribution certificate and private key.
    required: true
  ios_distribution_p12_password:
    description: Password for the distribution P12.
    required: true
  ios_profiles_archive_base64:
    description: Base64-encoded tar.gz containing all required App Store profiles.
    required: true
  asc_api_key_p8_base64:
    description: Base64-encoded App Store Connect Team API private key.
    required: false
    default: ""
  asc_key_id:
    description: App Store Connect Team API Key ID.
    required: false
    default: ""
  asc_issuer_id:
    description: App Store Connect Team API Issuer ID.
    required: false
    default: ""
  review_demo_account_name:
    description: Optional App Review demo account name; pass from a protected secret when required.
    required: false
    default: ""
  review_demo_account_password:
    description: Optional App Review demo account password; pass from a protected secret when required.
    required: false
    default: ""

outputs:
  source_sha:
    description: Exact source commit archived by the action.
    value: ${{ steps.preflight.outputs.source_sha }}
  marketing_version:
    description: Marketing version used for the archive.
    value: ${{ steps.preflight.outputs.marketing_version }}
  build_number:
    description: Resolved build number used for the archive.
    value: ${{ steps.resolve.outputs.build_number }}
  archive_path:
    description: Temporary archive path; removed during cleanup unless retained as an Artifact.
    value: ${{ steps.archive.outputs.archive_path }}
  ipa_path:
    description: IPA path retained until the caller job ends.
    value: ${{ steps.export.outputs.ipa_path }}
  ipa_sha256:
    description: SHA-256 digest of the exported IPA.
    value: ${{ steps.export.outputs.ipa_sha256 }}
  asc_build_id:
    description: App Store Connect build resource ID, when upload is enabled and observed.
    value: ${{ steps.upload.outputs.asc_build_id }}
  asc_upload_state:
    description: Final observed BuildUpload state.
    value: ${{ steps.upload.outputs.asc_upload_state }}
  asc_processing_state:
    description: Final observed build processing state.
    value: ${{ steps.upload.outputs.asc_processing_state }}
  testflight_internal_state:
    description: Final observed internal TestFlight state.
    value: ${{ steps.upload.outputs.testflight_internal_state }}
  app_store_version_id:
    description: App Store version resource ID when App Store preparation is enabled.
    value: ${{ steps.app_store.outputs.app_store_version_id }}
  app_store_version_state:
    description: App Store version state observed during preparation or submission.
    value: ${{ steps.app_store.outputs.app_store_version_state }}
  review_submission_id:
    description: Review submission resource ID when the App Store version is submitted.
    value: ${{ steps.app_store.outputs.review_submission_id }}
  review_submission_state:
    description: Review submission state returned by App Store Connect.
    value: ${{ steps.app_store.outputs.review_submission_state }}
  review_submitted:
    description: Whether this run submitted or confirmed an existing review submission.
    value: ${{ steps.app_store.outputs.review_submitted }}
  app_store_no_op:
    description: Whether App Store release work ended as a successful idempotent no-op.
    value: ${{ steps.app_store.outputs.app_store_no_op }}
  app_store_no_op_reason:
    description: Reason for an App Store release no-op, such as already_submitted or already_released.
    value: ${{ steps.app_store.outputs.app_store_no_op_reason }}
  app_store_already_submitted:
    description: Whether the requested App Store version was already submitted.
    value: ${{ steps.app_store.outputs.app_store_already_submitted }}
  app_store_already_released:
    description: Whether the requested App Store version was already released.
    value: ${{ steps.app_store.outputs.app_store_already_released }}
  asc_text_metadata_updated:
    description: Whether declared App Store text metadata was updated and verified.
    value: ${{ steps.app_store.outputs.asc_text_metadata_updated }}
  asc_media_replaced:
    description: Whether declared App Store screenshot or app preview collections were replaced and verified.
    value: ${{ steps.app_store.outputs.asc_media_replaced }}

runs:
  using: composite
  steps:
    - name: Initialize isolated task directories
      id: init
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/init.sh"

    - name: Validate source, configuration, inputs, and toolchain
      id: preflight
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        IOS_CONFIG_PATH: ${{ inputs.config_path }}
        IOS_MARKETING_VERSION: ${{ inputs.marketing_version }}
        IOS_BUILD_NUMBER: ${{ inputs.build_number }}
        IOS_UPLOAD_TO_ASC: ${{ inputs.upload_to_asc }}
        IOS_SUBMIT_TO_REVIEW: ${{ inputs.submit_to_review }}
        IOS_UPDATE_ASC_TEXT_METADATA: ${{ inputs.update_asc_text_metadata }}
        IOS_REPLACE_ASC_MEDIA: ${{ inputs.replace_asc_media }}
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/preflight.sh"

    - name: Prepare ASC key for app and build resolution
      id: asc_key_for_number
      if: ${{ inputs.upload_to_asc == 'true' || (steps.preflight.outputs.build_number_strategy == 'asc_increment' && inputs.build_number == '') }}
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        ASC_API_KEY_P8_BASE64: ${{ inputs.asc_api_key_p8_base64 }}
        ASC_KEY_ID: ${{ inputs.asc_key_id }}
        ASC_ISSUER_ID: ${{ inputs.asc_issuer_id }}
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/prepare-asc-key.sh"

    - name: Resolve or verify App Store Connect app
      id: resolve_app
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
      run: |
        ruby "$IOS_BUILD_ACTION_PATH/scripts/resolve-asc-app.rb" \
          --config "${{ steps.preflight.outputs.config_path }}" \
          --upload-to-asc "${{ inputs.upload_to_asc }}" \
          --key-id "${{ inputs.asc_key_id }}" \
          --issuer-id "${{ inputs.asc_issuer_id }}" \
          --key-path "${{ steps.asc_key_for_number.outputs.asc_key_path }}" \
          --output "$IOS_BUILD_WORK_DIR/runtime-ios-build.yml" \
          --github-output "$GITHUB_OUTPUT"

    - name: Resolve build number
      id: resolve
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        IOS_CONFIG_PATH: ${{ steps.resolve_app.outputs.config_path }}
        IOS_MARKETING_VERSION: ${{ steps.preflight.outputs.marketing_version }}
        IOS_REQUESTED_BUILD_NUMBER: ${{ steps.preflight.outputs.requested_build_number }}
        ASC_KEY_PATH: ${{ steps.asc_key_for_number.outputs.asc_key_path }}
        ASC_KEY_ID: ${{ inputs.asc_key_id }}
        ASC_ISSUER_ID: ${{ inputs.asc_issuer_id }}
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/resolve-build-number.sh"

    - name: Remove early ASC key copy
      if: ${{ steps.asc_key_for_number.outputs.asc_key_path != '' }}
      shell: bash
      run: rm -f -- "${{ steps.asc_key_for_number.outputs.asc_key_path }}"

    - name: Install verified Flutter SDK
      if: ${{ steps.preflight.outputs.dependency_mode == 'flutter' }}
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        IOS_CONFIG_PATH: ${{ steps.resolve_app.outputs.config_path }}
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/install-flutter.sh"

    - name: Install locked project dependencies
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        IOS_CONFIG_PATH: ${{ steps.resolve_app.outputs.config_path }}
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/install-dependencies.sh"

    - name: Install temporary signing material
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        IOS_CONFIG_PATH: ${{ steps.resolve_app.outputs.config_path }}
        IOS_DISTRIBUTION_P12_BASE64: ${{ inputs.ios_distribution_p12_base64 }}
        IOS_DISTRIBUTION_P12_PASSWORD: ${{ inputs.ios_distribution_p12_password }}
        IOS_PROFILES_ARCHIVE_BASE64: ${{ inputs.ios_profiles_archive_base64 }}
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/install-signing.sh"

    - name: Archive
      id: archive
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        IOS_CONFIG_PATH: ${{ steps.resolve_app.outputs.config_path }}
        IOS_MARKETING_VERSION: ${{ steps.preflight.outputs.marketing_version }}
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/archive.sh"

    - name: Export IPA
      id: export
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        IOS_CONFIG_PATH: ${{ steps.resolve_app.outputs.config_path }}
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/export.sh"

    - name: Inspect exported IPA
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        IOS_CONFIG_PATH: ${{ steps.resolve_app.outputs.config_path }}
        IOS_MARKETING_VERSION: ${{ steps.preflight.outputs.marketing_version }}
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/inspect-ipa.sh"

    - name: Collect build evidence
      if: ${{ always() && steps.init.outcome == 'success' }}
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        IOS_CONFIG_PATH: ${{ steps.resolve_app.outputs.config_path || steps.preflight.outputs.config_path || inputs.config_path }}
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/collect-artifacts.sh"

    - name: Retain IPA and build evidence before Apple upload
      if: ${{ always() && steps.init.outcome == 'success' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ios-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.init.outputs.output_dir }}
        if-no-files-found: warn
        retention-days: ${{ steps.preflight.outputs.retention_days || '30' }}
        compression-level: 0

    - name: Prepare ASC key for upload
      id: asc_key_for_upload
      if: ${{ success() && inputs.upload_to_asc == 'true' }}
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        ASC_API_KEY_P8_BASE64: ${{ inputs.asc_api_key_p8_base64 }}
        ASC_KEY_ID: ${{ inputs.asc_key_id }}
        ASC_ISSUER_ID: ${{ inputs.asc_issuer_id }}
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/prepare-asc-key.sh"

    - name: Upload validated IPA to App Store Connect
      id: send_upload
      if: ${{ success() && inputs.upload_to_asc == 'true' }}
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        IOS_CONFIG_PATH: ${{ steps.resolve_app.outputs.config_path }}
        IOS_MARKETING_VERSION: ${{ steps.preflight.outputs.marketing_version }}
        ASC_KEY_PATH: ${{ steps.asc_key_for_upload.outputs.asc_key_path }}
        ASC_KEY_ID: ${{ inputs.asc_key_id }}
        ASC_ISSUER_ID: ${{ inputs.asc_issuer_id }}
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/upload.sh"

    - name: Create or update App Store version and metadata
      id: app_store_prepare
      if: ${{ success() && inputs.upload_to_asc == 'true' && steps.preflight.outputs.app_store_enabled == 'true' }}
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        IOS_CONFIG_PATH: ${{ steps.resolve_app.outputs.config_path }}
        IOS_MARKETING_VERSION: ${{ steps.preflight.outputs.marketing_version }}
        ASC_KEY_PATH: ${{ steps.asc_key_for_upload.outputs.asc_key_path }}
        ASC_KEY_ID: ${{ inputs.asc_key_id }}
        ASC_ISSUER_ID: ${{ inputs.asc_issuer_id }}
        ASC_REVIEW_DEMO_ACCOUNT_NAME: ${{ inputs.review_demo_account_name }}
        ASC_REVIEW_DEMO_ACCOUNT_PASSWORD: ${{ inputs.review_demo_account_password }}
      run: |
        ruby "$IOS_BUILD_ACTION_PATH/scripts/release-app-store.rb" \
          --config "$IOS_CONFIG_PATH" \
          --phase prepare \
          --marketing-version "$IOS_MARKETING_VERSION" \
          --key-id "$ASC_KEY_ID" \
          --issuer-id "$ASC_ISSUER_ID" \
          --key-path "$ASC_KEY_PATH" \
          --submit-to-review false \
          --update-text-metadata "${{ inputs.update_asc_text_metadata }}" \
          --replace-media "${{ inputs.replace_asc_media }}" \
          --output "$IOS_BUILD_OUTPUT_DIR/app-store-status.json" \
          --github-output "$GITHUB_OUTPUT"

    - name: Wait for App Store Connect processing
      id: upload
      if: ${{ success() && inputs.upload_to_asc == 'true' }}
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        IOS_CONFIG_PATH: ${{ steps.resolve_app.outputs.config_path }}
        IOS_MARKETING_VERSION: ${{ steps.preflight.outputs.marketing_version }}
        IOS_RESOLVED_BUILD_NUMBER: ${{ steps.resolve.outputs.build_number }}
        ASC_KEY_PATH: ${{ steps.asc_key_for_upload.outputs.asc_key_path }}
        ASC_KEY_ID: ${{ inputs.asc_key_id }}
        ASC_ISSUER_ID: ${{ inputs.asc_issuer_id }}
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/wait-upload.sh"

    - name: Attach processed build and optionally submit for review
      id: app_store
      if: ${{ success() && inputs.upload_to_asc == 'true' && steps.preflight.outputs.app_store_enabled == 'true' }}
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        IOS_CONFIG_PATH: ${{ steps.resolve_app.outputs.config_path }}
        IOS_MARKETING_VERSION: ${{ steps.preflight.outputs.marketing_version }}
        ASC_KEY_PATH: ${{ steps.asc_key_for_upload.outputs.asc_key_path }}
        ASC_KEY_ID: ${{ inputs.asc_key_id }}
        ASC_ISSUER_ID: ${{ inputs.asc_issuer_id }}
        ASC_REVIEW_DEMO_ACCOUNT_NAME: ${{ inputs.review_demo_account_name }}
        ASC_REVIEW_DEMO_ACCOUNT_PASSWORD: ${{ inputs.review_demo_account_password }}
      run: |
        ruby "$IOS_BUILD_ACTION_PATH/scripts/release-app-store.rb" \
          --config "$IOS_CONFIG_PATH" \
          --phase finalize \
          --marketing-version "$IOS_MARKETING_VERSION" \
          --status "$IOS_BUILD_OUTPUT_DIR/asc-status.json" \
          --key-id "$ASC_KEY_ID" \
          --issuer-id "$ASC_ISSUER_ID" \
          --key-path "$ASC_KEY_PATH" \
          --submit-to-review "${{ inputs.submit_to_review }}" \
          --update-text-metadata "${{ inputs.update_asc_text_metadata }}" \
          --replace-media "${{ inputs.replace_asc_media }}" \
          --output "$IOS_BUILD_OUTPUT_DIR/app-store-status.json" \
          --github-output "$GITHUB_OUTPUT"

    - name: Collect upload diagnostics
      if: ${{ always() && steps.init.outcome == 'success' }}
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        IOS_CONFIG_PATH: ${{ steps.resolve_app.outputs.config_path || steps.preflight.outputs.config_path || inputs.config_path }}
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/collect-artifacts.sh"

    - name: Retain upload status and diagnostics
      if: ${{ always() && steps.init.outcome == 'success' && inputs.upload_to_asc == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ios-upload-status-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ steps.init.outputs.output_dir }}/asc-status.json
          ${{ steps.init.outputs.output_dir }}/app-store-status.json
          ${{ steps.init.outputs.output_dir }}/build-metadata.json
          ${{ steps.init.outputs.output_dir }}/logs/upload.log
        if-no-files-found: warn
        retention-days: ${{ steps.preflight.outputs.retention_days || '30' }}

    - name: Remove temporary signing material
      if: ${{ always() && steps.init.outcome == 'success' }}
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/cleanup.sh"
