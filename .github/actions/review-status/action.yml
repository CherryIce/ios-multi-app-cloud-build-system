name: Query App Store review status
description: Query one iOS App Store version review state and optionally send the result to a notification webhook.

inputs:
  app_id:
    description: Numeric App Store Connect app ID.
    required: true
  marketing_version:
    description: App Store marketing version to query, for example 2.3.0.
    required: true
  asc_api_key_p8_base64:
    description: Base64-encoded App Store Connect Team API private key.
    required: true
  asc_key_id:
    description: App Store Connect Team API Key ID.
    required: true
  asc_issuer_id:
    description: App Store Connect Team API Issuer ID.
    required: true
  notification_webhook_url:
    description: Optional HTTPS endpoint that receives the manual-query result as JSON. Pass from a protected secret.
    required: false
    default: ""
  notification_webhook_bearer:
    description: Optional bearer token for the notification endpoint. Pass from a protected secret.
    required: false
    default: ""

outputs:
  app_store_version_id:
    description: App Store version resource ID.
    value: ${{ steps.query.outputs.app_store_version_id }}
  marketing_version:
    description: Marketing version that was queried.
    value: ${{ steps.query.outputs.marketing_version }}
  app_store_version_state:
    description: Current App Store review and release state.
    value: ${{ steps.query.outputs.app_store_version_state }}
  status_group:
    description: Normalized state group such as in_review, approved, released, or attention_required.
    value: ${{ steps.query.outputs.status_group }}
  attention_required:
    description: Whether the observed state needs developer attention.
    value: ${{ steps.query.outputs.attention_required }}
  terminal:
    description: Whether the observed state is terminal for this version.
    value: ${{ steps.query.outputs.terminal }}
  checked_at:
    description: UTC timestamp of the query.
    value: ${{ steps.query.outputs.checked_at }}
  notification_sent:
    description: Whether the optional notification webhook accepted the result. A false value does not fail a successful ASC query.
    value: ${{ steps.query.outputs.notification_sent }}
  status_path:
    description: Path to the JSON status artifact on the runner.
    value: ${{ steps.init.outputs.output_dir }}/asc-review-status.json

runs:
  using: composite
  steps:
    - name: Initialize isolated task directories
      id: init
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/init.sh"

    - name: Prepare ASC key
      id: asc_key
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        ASC_API_KEY_P8_BASE64: ${{ inputs.asc_api_key_p8_base64 }}
        ASC_KEY_ID: ${{ inputs.asc_key_id }}
        ASC_ISSUER_ID: ${{ inputs.asc_issuer_id }}
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/prepare-asc-key.sh"

    - name: Query review status
      id: query
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
        ASC_APP_ID: ${{ inputs.app_id }}
        ASC_MARKETING_VERSION: ${{ inputs.marketing_version }}
        ASC_KEY_ID: ${{ inputs.asc_key_id }}
        ASC_ISSUER_ID: ${{ inputs.asc_issuer_id }}
        ASC_KEY_PATH: ${{ steps.asc_key.outputs.asc_key_path }}
        ASC_NOTIFICATION_WEBHOOK_URL: ${{ inputs.notification_webhook_url }}
        ASC_NOTIFICATION_WEBHOOK_BEARER: ${{ inputs.notification_webhook_bearer }}
      run: |
        ruby "$IOS_BUILD_ACTION_PATH/scripts/query-review-status.rb" \
          --app-id "$ASC_APP_ID" \
          --marketing-version "$ASC_MARKETING_VERSION" \
          --key-id "$ASC_KEY_ID" \
          --issuer-id "$ASC_ISSUER_ID" \
          --key-path "$ASC_KEY_PATH" \
          --output "$IOS_BUILD_OUTPUT_DIR/asc-review-status.json" \
          --github-output "$GITHUB_OUTPUT" \
          --github-summary "$GITHUB_STEP_SUMMARY"

    - name: Remove temporary ASC key
      if: ${{ always() && steps.init.outcome == 'success' }}
      shell: bash
      env:
        IOS_BUILD_ACTION_PATH: ${{ github.action_path }}/../../..
      run: bash "$IOS_BUILD_ACTION_PATH/scripts/cleanup.sh"
