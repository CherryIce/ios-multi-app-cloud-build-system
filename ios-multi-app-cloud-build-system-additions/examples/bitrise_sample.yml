# PSEUDOCODE DRAFT: adapt and validate this in a real Bitrise app before use.
# This path uses Fastlane match as its only signing source. Do not also install
# unrelated Bitrise-managed profiles unless the fallback behavior is explicit.

format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
workflows:
  primary:
    steps:
      - git-clone: {}
      - cocoapods-install: {}
      - fastlane:
          inputs:
            - lane: ios build
            - update_fastlane: "false" # App repository must commit Gemfile + Gemfile.lock.
      - deploy-to-bitrise-io:
          inputs:
            - deploy_path: $BITRISE_DEPLOY_DIR
